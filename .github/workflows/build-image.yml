name: Build & push image

# Builds the OpenBB MCP server image for ARM64 (Oracle A1) and pushes to GHCR.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm # native arm64, free for public repos
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openbb-mcp-docker:latest
            ghcr.io/${{ github.repository_owner }}/openbb-mcp-docker:${{ github.sha }}
      # Auto-CD: tell muffin-deployment a fresh image is on GHCR so it redeploys the Swarm stack
      # (deploy.yml listens for repository_dispatch type=deploy). Needs a cross-repo PAT — the
      # built-in GITHUB_TOKEN can't dispatch to another repo.
      - name: Trigger deploy
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/muffin-deployment
          event-type: deploy
          client-payload: '{"repo": "${{ github.repository }}", "sha": "${{ github.sha }}"}'
